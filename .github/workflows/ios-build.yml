name: iOS Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline core
        run: ./scripts/verify-offline-core.sh
      - name: Verify image assets
        run: python3 ./scripts/verify-image-assets.py
      - name: Verify privacy boundaries
        run: python3 ./scripts/verify-privacy-boundaries.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ParkHunt.xcodeproj \
            -scheme ParkHunt \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
