name: iOS Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Self-test content validator
        run: python3 ./scripts/validate-content-admin.py --self-test
      - name: Validate content admin
        run: python3 ./scripts/validate-content-admin.py
      - name: Verify content admin catalog
        run: python3 ./scripts/build-content-catalog.py --check
      - name: Verify offline core
        run: ./scripts/verify-offline-core.sh
      - name: Verify image assets
        run: python3 ./scripts/verify-image-assets.py
      - name: Verify privacy boundaries
        run: python3 ./scripts/verify-privacy-boundaries.py
      - name: Verify battery boundaries
        run: python3 ./scripts/verify-battery-boundaries.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run unit tests
        run: |
          set -o pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable", True) and device["name"].startswith("iPhone")))')"
          xcodebuild \
            -project ParkHunt.xcodeproj \
            -scheme ParkHunt \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:ParkHuntTests \
            test
      - name: Run UI tests across device classes
        run: ./scripts/run-device-ui-tests.sh
      - name: Upload device-test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-results
          path: TestResults
          if-no-files-found: ignore
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ParkHunt.xcodeproj \
            -scheme ParkHunt \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
