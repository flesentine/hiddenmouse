name: ParkHunt
options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  FieldTest: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  FieldTest: Config/FieldTest.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ParkHunt:
    type: application
    platform: iOS
    sources:
      - path: ParkHunt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flesentine.parkhunt
        PRODUCT_NAME: ParkHunt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Park Hunt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Park Hunt uses your location only while you use Nearby to help show discoveries around you. Your location history is not stored.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: ParkHuntClip
    scheme:
      gatherCoverageData: true
      testTargets:
        - ParkHuntTests
        - ParkHuntUITests
  ParkHuntClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: ParkHuntClip
      - path: ParkHunt/Core/Content/AppClipEntry.swift
      - path: ParkHunt/Core/Content/BundledContentStore.swift
      - path: ParkHunt/Core/Content/BundledRevealImageStore.swift
      - path: ParkHunt/Core/Content/ContentCatalog.swift
      - path: ParkHunt/Core/Content/ContentCatalogSource.swift
      - path: ParkHunt/Core/Content/ContentCatalogValidator.swift
      - path: ParkHunt/Core/Content/ContentLoader.swift
      - path: ParkHunt/Core/Content/ContentSnapshot.swift
      - path: ParkHunt/Core/Domain/Discovery.swift
      - path: ParkHunt/Core/Domain/DomainValidation.swift
      - path: ParkHunt/Core/Domain/PlaceModels.swift
      - path: ParkHunt/Core/Domain/UserProgress.swift
      - path: ParkHunt/Core/Offline/OfflineReadiness.swift
      - path: ParkHunt/Features/Hunt/HuntPresentation.swift
      - path: ParkHunt/Features/Hunt/HuntProgression.swift
      - path: ParkHunt/Resources/content-catalog.json
      - path: ParkHunt/Resources/Images
    entitlements:
      path: ParkHuntClip/Clip.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flesentine.parkhunt.Clip
        PRODUCT_NAME: ParkHuntClip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Park Hunt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES

  ParkHuntTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkHuntTests
    dependencies:
      - target: ParkHunt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flesentine.parkhunt.tests
        GENERATE_INFOPLIST_FILE: YES
  ParkHuntUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParkHuntUITests
    dependencies:
      - target: ParkHunt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flesentine.parkhunt.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ParkHunt
