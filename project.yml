name: ParkHunt
options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ParkHunt:
    type: application
    platform: iOS
    sources:
      - path: ParkHunt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flesentine.parkhunt
        PRODUCT_NAME: ParkHunt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Park Hunt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
      testTargets:
        - ParkHuntTests
  ParkHuntTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkHuntTests
    dependencies:
      - target: ParkHunt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flesentine.parkhunt.tests
        GENERATE_INFOPLIST_FILE: YES
